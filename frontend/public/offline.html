<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a66c2" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 16px; box-sizing: border-box; background: #f3f6f8; color: #111827;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      main { max-width: 22rem; background: #fff; border: 1px solid #dce3ea; border-radius: 12px; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 1.25rem; }
      p { margin: 0 0 16px; color: #4b5563; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #0a66c2;
        color: #fff; font-size: 1rem; cursor: pointer; }
      button:hover { background: #004182; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Jobs and applications need an internet connection. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
